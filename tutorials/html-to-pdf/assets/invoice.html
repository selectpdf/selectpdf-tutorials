<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Invoice</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; color: #1f2933; margin: 40px; }
        h1 { color: #b45309; margin-bottom: 0; }
        .muted { color: #6b7280; }
        table { width: 100%; border-collapse: collapse; margin-top: 24px; }
        th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e5e7eb; }
        th { background: #fef3c7; }
        .total { text-align: right; font-weight: bold; margin-top: 16px; }
    </style>
</head>
<body>
    <h1>Invoice #1042</h1>
    <p class="muted">Issued 7 July 2026 &middot; Acme Corporation</p>

    <table>
        <thead>
            <tr><th>Description</th><th>Qty</th><th>Unit price</th><th>Amount</th></tr>
        </thead>
        <tbody>
            <tr><td>SelectPdf Developer License</td><td>1</td><td>$499.00</td><td>$499.00</td></tr>
            <tr><td>Priority Support (1 year)</td><td>1</td><td>$199.00</td><td>$199.00</td></tr>
        </tbody>
    </table>

    <p class="total">Total due: $698.00</p>
</body>
</html>
